<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valdo Real Estate | Luxury Properties in Tbilisi</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --accent: #d4af37; /* Luxury Gold */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent);
        }

        .contact-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .contact-btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
        }

        /* Hero Section */
        .hero {
            padding: 60px 5% 30px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Properties Grid */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 5%;
            flex: 1;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card-img-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            position: relative;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img-container img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
        }

        .card-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-location {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-specs {
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card-specs span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Modal Details */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 30px;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-modal:hover {
            background: var(--accent);
            color: var(--bg-dark);
        }

        .modal-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-price {
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .modal-desc {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media(max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Valdo <span>Real Estate</span></div>
        <a href="https://wa.me/" target="_blank" class="contact-btn">
            <i class="fab fa-whatsapp"></i> კონტაქტი
        </a>
    </header>

    <section class="hero">
        <h1>ექსკლუზიური უძრავი ქონება</h1>
        <p>აირჩიეთ საუკეთესო პრემიუმ კლასის ობიექტები თბილისში</p>
    </section>

    <div class="container">
        <div class="grid" id="property-grid">
            <!-- JavaScript dynamically injects properties here -->
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="property-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn"><i class="fas fa-times"></i></button>
            <img id="modal-image" class="modal-img" src="" alt="">
            <div id="modal-price" class="modal-price"></div>
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-location" class="card-location" style="margin-bottom: 15px;"></div>
            <div id="modal-specs" class="card-specs" style="margin-bottom: 20px;"></div>
            <div id="modal-desc" class="modal-desc"></div>
            <a href="https://wa.me/" target="_blank" class="contact-btn" style="width: 100%; justify-content: center; padding: 12px;">
                <i class="fab fa-whatsapp"></i> WhatsApp-ით დაკავშირება
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Valdo Real Estate. ყველა უფლება დაცულია.</p>
    </footer>

    <script>
        const properties = [
            {
                id: 1,
                title: "Uznadze Heritage Residence",
                price: "$280,000",
                location: "დ. უზნაძის ქუჩა, მთაწმინდა, თბილისი",
                specs: "3 ოთახი • 2 საძინებელი • 110 მ²",
                image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800&q=80",
                description: "ისტორიულ უბანში მდებარე პრემიუმ კლასის ბინა მაღალი ჭერით, დახვეწილი დიზაინით და სრული კომფორტით. უმაღლესი ხარისხის რემონტი და ტექნიკა."
            },
            {
                id: 2,
                title: "Uznadze Commercial Leasing",
                price: "$2,500 / თვეში",
                location: "დ. უზნაძის ქუჩა, ჩუღურეთი, თბილისი",
                specs: "კომერციული ფართი • 1 დარბაზი • 85 მ²",
                image: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=800&q=80",
                description: "იდეალური კომერციული ფართი საოფისე ან საბუტიკე საქმიანობისთვის, ცენტრალურ და მრავალხალხიან ადგილას. სრულიად გარემონტებული და მზად ოპერირებისთვის."
            },
            {
                id: 3,
                title: "Rustaveli Opera Luxury Suite",
                price: "$420,000",
                location: "რუსთაველის გამზირი, მთაწმინდა, თბილისი",
                specs: "4 ოთახი • 3 საძინებელი • 150 მ²",
                image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80",
                description: "ექსკლუზიური პენტჰაუსი ოპერის თეატრის მიმდებარედ. საუკეთესო ხედები ქალაქზე, პრემიუმ დონის ავეჯი, დაცული შესასვლელი და პარკინგი."
            }
        ];

        const grid = document.getElementById('property-grid');
        const modal = document.getElementById('property-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Render properties
        properties.forEach(prop => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img-container">
                    <img src="${prop.image}" alt="${prop.title}">
                </div>
                <div class="card-content">
                    <div class="card-price">${prop.price}</div>
                    <div class="card-title">${prop.title}</div>
                    <div class="card-location"><i class="fas fa-map-marker-alt"></i> ${prop.location}</div>
                    <div class="card-specs"><span><i class="fas fa-vector-square"></i> ${prop.specs}</span></div>
                </div>
            `;
            card.addEventListener('click', () => openModal(prop));
            grid.appendChild(card);
        });

        function openModal(prop) {
            document.getElementById('modal-image').src = prop.image;
            document.getElementById('modal-price').innerText = prop.price;
            document.getElementById('modal-title').innerText = prop.title;
            document.getElementById('modal-location').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${prop.location}`;
            document.getElementById('modal-specs').innerHTML = `<span><i class="fas fa-vector-square"></i> ${prop.specs}</span>`;
            document.getElementById('modal-desc').innerText = prop.description;
            modal.classList.add('active');
        }

        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
