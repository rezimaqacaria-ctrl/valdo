<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valdo Real Estate | Luxury Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --accent: #A3814C; /* Bronze/Gold from your design */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        
        /* Header */
        header {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 10, 0.9);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
        .logo span { color: var(--accent); }
        .contact-btn {
            background: transparent; border: 1px solid var(--accent); color: var(--accent);
            padding: 8px 20px; border-radius: 4px; text-decoration: none; transition: 0.3s;
        }
        .contact-btn:hover { background: var(--accent); color: var(--bg-dark); }

        /* Page Views */
        .page-view { display: none; animation: fadeIn 0.3s ease; }
        .page-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- HOME PAGE --- */
        .hero { padding: 60px 5% 30px; text-align: center; }
        .hero h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 10px; }
        .hero p { color: var(--text-muted); }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px;
            overflow: hidden; cursor: pointer; transition: 0.3s;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .card-img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 20px; }
        .card-price { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; }
        .card-location { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
        .card-specs { border-top: 1px solid var(--border-color); padding-top: 15px; font-size: 0.85rem; color: var(--text-muted); }

        /* --- DETAIL PAGE --- */
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted);
            text-decoration: none; margin-bottom: 20px; cursor: pointer; transition: 0.2s;
        }
        .back-btn:hover { color: var(--accent); }
        
        .detail-hero-img { width: 100%; height: 500px; object-fit: cover; border-radius: 12px; margin-bottom: 30px; }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .detail-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        .detail-location { color: var(--text-muted); font-size: 1.1rem; }
        .detail-price-box { background: var(--card-bg); border: 1px solid var(--accent); padding: 20px; border-radius: 8px; text-align: center; min-width: 250px; }
        .detail-price { font-size: 2rem; color: var(--accent); font-weight: 700; }
        
        .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        @media(max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } .detail-hero-img { height: 300px; } }
        
        .section-title { font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; color: var(--accent); }
        .detail-desc { color: var(--text-muted); line-height: 1.8; font-size: 1.05rem; margin-bottom: 30px; }
        
        .features-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .features-list li { color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .features-list li i { color: var(--accent); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .gallery-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .gallery-grid img:hover { transform: scale(1.05); }

        footer { text-align: center; padding: 30px; border-top: 1px solid var(--border-color); color: var(--text-muted); margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="goHome()">Valdo <span>Real Estate</span></div>
        <a href="https://wa.me/995592613061" target="_blank" class="contact-btn"><i class="fab fa-whatsapp"></i> კონტაქტი</a>
    </header>

    <!-- 1. HOME PAGE (ბინების სია) -->
    <div id="home-view" class="page-view active">
        <section class="hero">
            <h1>პრემიუმ კლასის ობიექტები</h1>
            <p>საუკეთესო კომერციული და საცხოვრებელი ფართები თბილისში</p>
        </section>
        <div class="container">
            <div class="grid" id="property-grid">
                <!-- აქ ჯავასკრიპტი ჩასვამს ქარდებს -->
            </div>
        </div>
    </div>

    <!-- 2. DETAIL PAGE (კონკრეტული ობიექტის გვერდი) -->
    <div id="detail-view" class="page-view">
        <div class="container">
            <a onclick="goHome()" class="back-btn"><i class="fas fa-arrow-left"></i> უკან დაბრუნება</a>
            
            <img id="d-hero-img" class="detail-hero-img" src="" alt="">
            
            <div class="detail-header">
                <div>
                    <h1 id="d-title" class="detail-title"></h1>
                    <div id="d-location" class="detail-location"><i class="fas fa-map-marker-alt"></i> </div>
                </div>
                <div class="detail-price-box">
                    <div class="text-muted" style="font-size: 0.9rem; margin-bottom: 5px;">საწყისი ფასი</div>
                    <div id="d-price" class="detail-price"></div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">დღგ-ს გარეშე</div>
                </div>
            </div>

            <div class="detail-grid">
                <div>
                    <h2 class="section-title">აღწერა</h2>
                    <div id="d-desc" class="detail-desc"></div>
                    
                    <h2 class="section-title">ფოტოგალერეა</h2>
                    <div id="d-gallery" class="gallery-grid"></div>
                </div>
                
                <div>
                    <h2 class="section-title">მახასიათებლები</h2>
                    <ul id="d-features" class="features-list"></ul>
                    
                    <a href="https://wa.me/995592613061" target="_blank" class="contact-btn" style="display: flex; justify-content: center; margin-top: 40px; padding: 15px; font-size: 1.1rem; background: var(--accent); color: #000;">
                        <i class="fab fa-whatsapp"></i> მოითხოვეთ შეთავაზება
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Valdo Real Estate. 82 D. Uznadze St.</p>
    </footer>

    <script>
        // შენი რეალური მონაცემები უზნაძის ქონებიდან
        const properties = [
            {
                id: "uznadze-leasing",
                title: "82 D. Uznadze St. — Commercial Leasing",
                price: "$18,000 / თვეში",
                location: "დ. უზნაძის 82, ჩუღურეთი, თბილისი",
                specs: "1,429 მ² • 4 სართული • კერძო ეზო",
                image: "https://rezimaqacaria-ctrl.github.io/uznadze-leasing-/back-phasade-aesthetic-double-wall.jpg", // მთავარი ფოტო
                description: "რესტავრირებული მე-19 საუკუნის კომერციული შენობა თბილისის ცენტრში (მარჯანიშვილის მეტროდან 5 წუთის სავალზე). იდეალურია კორპორატიული სათავო ოფისისთვის, IT ჰაბისთვის, საელჩოსთვის ან კლინიკისთვის. მოიცავს კერძო ეზოს (245 მ²), პარკინგს 5-6 ავტომობილზე, Daikin VRV კლიმატ-კონტროლის სისტემას და მაღალ ენერგოეფექტურობას. საერთო ფართი: 1,429 მ² (გამოსაყენებელი: 1,271.4 მ²).",
                features: [
                    "საერთო ფართი: 1,429 მ²",
                    "კერძო ეზო: 245 მ²",
                    "5-6 საპარკინგე ადგილი",
                    "Daikin VRV კლიმატ-კონტროლი",
                    "4 სართული + სარდაფი",
                    "ტერასა (24.7 მ²)",
                    "Grohe / Hansgrohe სანტექნიკა",
                    "მარჯანიშვილის მეტრომდე 450მ"
                ],
                gallery: [
                    "https://rezimaqacaria-ctrl.github.io/uznadze-leasing-/phasade.jpg",
                    "https://rezimaqacaria-ctrl.github.io/uznadze-leasing-/back-phasade-aesthetic.jpg",
                    "https://rezimaqacaria-ctrl.github.io/uznadze-leasing-/board room.jpg",
                    "https://rezimaqacaria-ctrl.github.io/uznadze-leasing-/office.jpg",
                    "https://rezimaqacaria-ctrl.github.io/uznadze-leasing-/staircase picture.jpg",
                    "https://rezimaqacaria-ctrl.github.io/uznadze-leasing-/terrace.jpg"
                ]
            }
        ];

        // 1. გამოვაჩინოთ ქარდები მთავარ გვერდზე
        const grid = document.getElementById('property-grid');
        properties.forEach(prop => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => window.location.hash = prop.id; // ქარდზე დაჭერისას ლინკი იცვლება
            card.innerHTML = `
                <img class="card-img" src="${prop.image}" alt="${prop.title}">
                <div class="card-content">
                    <div class="card-price">${prop.price}</div>
                    <div class="card-title">${prop.title}</div>
                    <div class="card-location"><i class="fas fa-map-marker-alt"></i> ${prop.location}</div>
                    <div class="card-specs">${prop.specs}</div>
                </div>
            `;
            grid.appendChild(card);
        });

        // 2. გვერდების გადართვის (SPA) ლოგიკა
        function handleRouting() {
            const hash = window.location.hash.substring(1); // იღებს id-ს (მაგ: 'uznadze-leasing')
            
            if (hash) {
                const prop = properties.find(p => p.id === hash);
                if (prop) {
                    showDetailView(prop);
                } else {
                    goHome();
                }
            } else {
                goHome();
            }
        }

        function showDetailView(prop) {
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('detail-view').classList.add('active');
            
            // ინფორმაციის შევსება
            document.getElementById('d-hero-img').src = prop.image;
            document.getElementById('d-title').innerText = prop.title;
            document.getElementById('d-price').innerText = prop.price;
            document.getElementById('d-location').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${prop.location}`;
            document.getElementById('d-desc').innerText = prop.description;
            
            // მახასიათებლები
            const featuresList = document.getElementById('d-features');
            featuresList.innerHTML = '';
            prop.features.forEach(feat => {
                featuresList.innerHTML += `<li><i class="fas fa-check"></i> ${feat}</li>`;
            });
            
            // ფოტოგალერეა
            const galleryDiv = document.getElementById('d-gallery');
            galleryDiv.innerHTML = '';
            prop.gallery.forEach(imgUrl => {
                galleryDiv.innerHTML += `<img src="${imgUrl}" alt="Gallery Image" onclick="window.open('${imgUrl}', '_blank')">`;
            });

            window.scrollTo(0, 0); // გვერდის თავში ატანა
        }

        function goHome() {
            window.location.hash = ''; // URL-ის გასუფთავება
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
            window.scrollTo(0, 0);
        }

        // როცა ლინკი იცვლება (მაგალითად ბექ ღილაკით), ვუსმენთ
        window.addEventListener('hashchange', handleRouting);
        // საწყისი ჩატვირთვა
        window.addEventListener('load', handleRouting);
    </script>
</body>
</html>
